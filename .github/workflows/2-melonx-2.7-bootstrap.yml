name: Sync MeloNX 2.7 and build Candela
on:
  push:
    branches: [sync/melonx-2.7]
    paths: [".github/workflows/2-melonx-2.7-bootstrap.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Apply pinned upstream source and Candela overlay
        run: |
          set -euo pipefail
          cp 1-1-candela-overlay.patch.gz /tmp/candela-overlay.patch.gz
          cp README.md /tmp/Candela-README.md
          cp -R .github /tmp/Candela-github
          cp .github/workflows/2-melonx-2.7-bootstrap.yml /tmp/melonx-2.7-bootstrap.yml
          git fetch https://starforgejo.dev/projects/MeloNX.git refs/tags/2.7
          UPSTREAM=$(git rev-parse FETCH_HEAD^{commit})
          test "$UPSTREAM" = 13700519f3abc4e6d7ed8a065b118b2cc59bcd67
          git read-tree --reset -u "$UPSTREAM"
          gunzip -c /tmp/candela-overlay.patch.gz | git apply --binary --index
          rm -rf .github
          cp -R /tmp/Candela-github .github
          cp /tmp/Candela-README.md README.md
          cp /tmp/candela-overlay.patch.gz 1-1-candela-overlay.patch.gz
          git add -A
          git -c user.name='gavin02031' -c user.email='gavin02031@users.noreply.github.com' commit -m 'Sync pinned MeloNX 2.7 source and preserve Candela frontend, presets and identity'
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Rebuild verified LibHac alpha.129 source and run tests
        run: |
          set -euo pipefail
          git clone https://starforgejo.dev/archive/LibHac_Ryubing.git /tmp/libhac
          git -C /tmp/libhac checkout 23e402ebb6dedc517e34a98a033078dc0f6fd478
          cd /tmp/libhac
          dotnet run --project build/_build.csproj -- --target Codegen --configuration Release
          dotnet pack src/LibHac/LibHac.csproj -c Release -p:PackageVersion=0.21.0-alpha.129 -o /tmp/libhac-feed
          dotnet test tests/LibHac.Tests/LibHac.Tests.csproj -c Release --logger 'trx;LogFileName=libhac-tests.trx'
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PYCODE'
          import xml.etree.ElementTree as E
          p='nuget.config'
          t=E.parse(p)
          for x in t.getroot().find('packageSources'):
              if x.get('key')=='LibHacAlpha': x.set('value','/tmp/libhac-feed')
          t.write(p,encoding='utf-8',xml_declaration=True)
          PYCODE
          echo 'LibHac alpha.129 rebuilt from 23e402ebb6dedc517e34a98a033078dc0f6fd478; official MeloNX 2.7 dylib embedded version confirms this source.' >> docs/melonx-2.7-integration.md
      - name: Publish .NET 10 native C# library
        run: |
          dotnet --info
          xcodebuild -version
          dotnet publish -c Release -r ios-arm64 -p:ExtraDefineConstants=DISABLE_UPDATER src/Ryujinx.Library --self-contained true
          test -f src/Ryujinx.Library/bin/Release/net10.0/ios-arm64/native/Ryujinx.Library.dylib
      - name: Build app and RAM donor extension without signing
        run: |
          xcodebuild -project src/MeloNX/MeloNX.xcodeproj -scheme MeloNX -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Verify extension and package IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 2 -name 'MeloNX.app' -type d | head -n 1)
          test -n "$APP"
          test -d "$APP/PlugIns/MeloNXRamDonor.appex"
          find "$APP" -iname "*AppIcon*" -o -name Assets.car
          xcrun --sdk iphoneos assetutil --info "$APP/Assets.car" > icon-assets.json
          cp "$APP/Assets.car" icon-Assets.car
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Candela-2.7-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Candela-2.7-unsigned-ipa
          path: |
            Candela-2.7-unsigned.ipa
            icon-assets.json
            icon-Assets.car
          if-no-files-found: error
      - name: Publish verified source to temporary sync branch
        run: |
          git show 13700519f3abc4e6d7ed8a065b118b2cc59bcd67:nuget.config > nuget.config
          git add docs/melonx-2.7-integration.md
          git -c user.name=gavin02031 -c user.email=gavin02031@users.noreply.github.com commit --amend --no-edit
          git config http.postBuffer 524288000
          git config core.compression 1
          git push origin HEAD:sync/melonx-2.7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LibHac-alpha129-verification
          path: |
            /tmp/libhac-feed/*.nupkg
            /tmp/libhac/tests/LibHac.Tests/TestResults/*.trx
          if-no-files-found: warn
