name: Build unsigned iOS IPA
# rebuild trigger: guest memory fallback, page table fallback, donor retry, address space probe, log share, pairing export, pastel UI, new first-launch setup, theme fix, pre-release, contrast fix, section syntax, log cap, game page, music, target 17.4, combine import, tuning presets, 512 MiB cache, music pause, thermal governor, settings hub, exit button, renames, swapchain fix, dots, home pill, inline settings rows, persistent home button
on:
  workflow_dispatch:
  push:
    branches: ["u/Candela", perf/iphone15-first-batch]
    paths: [".github/workflows/ios-unsigned-ipa.yml"]
permissions:
  contents: write
jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Inventory Xcode and select SDK27 if installed
        run: |
          ls -d /Applications/Xcode*.app
          XCODE27=$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort | tail -1)
          if [ -n "$XCODE27" ]; then
            sudo xcode-select -s "$XCODE27"
            echo 'CANDELA_SWIFT_FLAGS=$(inherited) CANDELA_IOS27_AIRPLAY' >> "$GITHUB_ENV"
          else
            sudo xcode-select -s /Applications/Xcode_26.3.app
            echo 'CANDELA_SWIFT_FLAGS=$(inherited)' >> "$GITHUB_ENV"
            echo 'iOS27 AirPlay registration is not compiled in this interim build' >> "$GITHUB_STEP_SUMMARY"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Rebuild verified LibHac alpha.129 source and run tests
        run: |
          set -euo pipefail
          git clone https://starforgejo.dev/archive/LibHac_Ryubing.git /tmp/libhac
          git -C /tmp/libhac checkout 23e402ebb6dedc517e34a98a033078dc0f6fd478
          cd /tmp/libhac
          dotnet run --project build/_build.csproj -- --target Codegen --configuration Release
          dotnet pack src/LibHac/LibHac.csproj -c Release -p:PackageVersion=0.21.0-alpha.129 -o /tmp/libhac-feed
          dotnet test tests/LibHac.Tests/LibHac.Tests.csproj -c Release --logger 'trx;LogFileName=libhac-tests.trx'
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PYCODE'
          import xml.etree.ElementTree as E
          p='nuget.config'
          t=E.parse(p)
          for x in t.getroot().find('packageSources'):
              if x.get('key')=='LibHacAlpha': x.set('value','/tmp/libhac-feed')
          t.write(p,encoding='utf-8',xml_declaration=True)
          PYCODE
      - name: Publish .NET 10 native C# library
        run: |
          dotnet --info
          xcodebuild -version
          dotnet publish -c Release -r ios-arm64 -p:ExtraDefineConstants=DISABLE_UPDATER src/Ryujinx.Library --self-contained true
          test -f src/Ryujinx.Library/bin/Release/net10.0/ios-arm64/native/Ryujinx.Library.dylib
      - name: Fetch StikJIT 1.9.0 xcframework (MPL-2.0, unmodified)
        run: |
          set -euo pipefail
          mkdir -p src/MeloNX/Vendor
          curl -fsSL -o /tmp/StikJIT.xcframework.zip https://github.com/StikDebug/StikJIT/releases/download/1.9.0/StikJIT.xcframework.zip
          unzip -q /tmp/StikJIT.xcframework.zip -d src/MeloNX/Vendor
          test -d src/MeloNX/Vendor/StikJIT.xcframework/ios-arm64/StikJIT.framework
          # The release's framework has no Info.plist, which Xcode refuses to embed in an app and sideloaders cannot sign.
          # Add a minimal one (the binary itself is untouched).
          FW=src/MeloNX/Vendor/StikJIT.xcframework/ios-arm64/StikJIT.framework
          if [ ! -f "$FW/Info.plist" ]; then
            P="$FW/Info.plist"
            /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string StikJIT' -c 'Add :CFBundleIdentifier string com.stikdebug.StikJIT' -c 'Add :CFBundleInfoDictionaryVersion string 6.0' -c 'Add :CFBundleName string StikJIT' -c 'Add :CFBundlePackageType string FMWK' -c 'Add :CFBundleShortVersionString string 1.9.0' -c 'Add :CFBundleVersion string 1.9.0' -c 'Add :MinimumOSVersion string 17.4' -c 'Add :CFBundleSupportedPlatforms array' -c 'Add :CFBundleSupportedPlatforms:0 string iPhoneOS' "$P"
          fi
          plutil -lint "$FW/Info.plist"
      - name: Build on-device pairing library (Rust, adapted from Husk)
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios
          cd src/candela-rppairing
          IPHONEOS_DEPLOYMENT_TARGET=15.0 cargo build --release --target aarch64-apple-ios
          mkdir -p ../MeloNX/Vendor/lib
          cp target/aarch64-apple-ios/release/libcandela_rppairing.a ../MeloNX/Vendor/lib/
      - name: Build app and RAM donor extension without signing
        run: |
          xcodebuild -project src/MeloNX/MeloNX.xcodeproj -scheme MeloNX -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build IPHONEOS_DEPLOYMENT_TARGET=17.4 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" SWIFT_ACTIVE_COMPILATION_CONDITIONS="$CANDELA_SWIFT_FLAGS" OTHER_LDFLAGS='$(inherited) -lcandela_rppairing' LIBRARY_SEARCH_PATHS='$(inherited) $(SRCROOT)/Vendor/lib' build
      - name: Verify extension and package IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 2 -name 'MeloNX.app' -type d | head -n 1)
          test -n "$APP"
          test -d "$APP/PlugIns/MeloNXRamDonor.appex"
          test -d "$APP/PlugIns/CandelaJITHelper.appex"
          test -d "$APP/Frameworks/StikJIT.framework"
          find "$APP" -iname "*AppIcon*" -o -name Assets.car
          xcrun --sdk iphoneos assetutil --info "$APP/Assets.car" > icon-assets.json
          cp "$APP/Assets.car" icon-Assets.car
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Candela-1.0-unsigned.ipa Payload
      - name: Publish release v1.0
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release v1.0]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Candela 1.0

          A performance-tuned iOS fork with a custom icon pack (plus 16 alternate app icons), a new interface option, and built-in JIT with on-device pairing on iOS 27 as an alternative to a separate helper app.

          This is an unsigned build. Sign and install it with your own signing tool, and keep the app extensions when signing.

          Notes
          - Built-in JIT and on-device pairing are new and still being tested across devices. The previous JIT options are unchanged and still selectable in Settings.
          - Build numbers and speed gains have not been measured.
          NOTES
          gh release create v1.0 Candela-1.0-unsigned.ipa --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Candela 1.0" --notes-file release-notes.md
      - name: Publish pre-release v1.1-ui
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Candela UI preview. New pastel look, first-launch setup (JIT, keys, firmware, optional games folder), built-in JIT with on-device pairing. Unsigned build: sign and install with your own tool and keep the app extensions. Compiled in CI only; speed has not been measured."
          if gh release view v1.1-ui --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.1-ui Candela-1.0-unsigned.ipa --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.1-ui Candela-1.0-unsigned.ipa --prerelease --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Candela 1.1 UI preview" --notes "$NOTES"
          fi
      - name: Publish release v1.2
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release v1.2]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes-1.2.md <<'NOTES'
          Candela 1.2

          What is new
          - Pastel interface with a first-launch setup (built-in JIT, keys, firmware, games folder).
          - Redesigned settings: pill tabs, one card per page, play styles (Cool, Balanced, Sharp), and a Back pill. Dotted backdrop across the app.
          - In-game home button with a Leave game confirmation.
          - Game page for each title: art, Play, favorite, last played, shader cache size, saved logs.
          - Music player: mini player and full player using your own music library, mixed under game audio. Pauses when you leave the app.
          - Per-game saved logs with a capped size, plus Share latest log in Settings > Advanced.
          - Starting settings for a few demanding games (async shader compilation, lower resolution cap), a larger shader cache budget (512 MiB), and a thermal governor that steps resolution down at the next launch when the phone runs hot.
          - Minimum iOS for this build is 17.4.

          Known gaps
          - The music player, thermal governor and new game page have had limited testing on devices. A black first frame in one game that clears after pause and resume is being investigated.
          - Speed gains have not been measured. This is a CI-compiled build.

          This is an unsigned build. Sign and install it with your own signing tool and keep the app extensions. Licensed AGPL-3.0-or-later.
          NOTES
          cp Candela-1.0-unsigned.ipa Candela-1.2-unsigned.ipa
          gh release create v1.2 Candela-1.2-unsigned.ipa --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Candela 1.2" --notes-file release-notes-1.2.md
      - uses: actions/upload-artifact@v4
        with:
          name: Candela-1.0-unsigned-ipa
          path: |
            Candela-1.0-unsigned.ipa
            icon-assets.json
            icon-Assets.car
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LibHac-alpha129-verification
          path: |
            /tmp/libhac-feed/*.nupkg
            /tmp/libhac/tests/LibHac.Tests/TestResults/*.trx
          if-no-files-found: warn
