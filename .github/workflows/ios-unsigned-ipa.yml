name: Build unsigned iOS IPA

# Manual only. Run it from the Actions tab: "Build unsigned iOS IPA" > Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [perf/iphone15-first-batch]
    paths: [".github/workflows/ios-unsigned-ipa.yml"]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show toolchain
        run: |
          dotnet --info
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # Same command as distribution/ios/xc-compile.sh. The Xcode "ShellScript" build
      # phase then moves the published dylib into Dependencies/Dynamic Libraries.
      - name: Publish C# core for ios-arm64
        run: |
          dotnet restore
          dotnet publish -c Release -r ios-arm64 -p:ExtraDefineConstants=DISABLE_UPDATER src/Ryujinx.Headless.SDL2 --self-contained true

      - name: Stage C# dylib and check exports
        run: |
          B=src/Ryujinx.Headless.SDL2/bin/Release/net8.0/ios-arm64
          ls -la $B/publish | head -40
          ls -la $B/native || true
          SRC=$B/publish/Ryujinx.Headless.SDL2.dylib
          test -f "$SRC" || SRC=$B/native/Ryujinx.Headless.SDL2.dylib
          test -f "$SRC"
          file "$SRC"
          mkdir -p "src/MeloNX/MeloNX/Dependencies/Dynamic Libraries"
          cp "$SRC" "src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/Ryujinx.Headless.SDL2.dylib"
          nm -gU "$SRC" | grep -E 'attach_gamepad|close_user|create_account' || echo 'EXPORTS MISSING'
          nm -gU "$SRC" | wc -l

      - name: Build app with xcodebuild (no signing)
        run: |
          xcodebuild \
            -project src/MeloNX/MeloNX.xcodeproj \
            -scheme MeloNX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name '*.app' -type d | head -n 1)
          echo "App bundle: $APP"
          test -n "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Candela-unsigned.ipa Payload
          ls -lh Candela-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Candela-unsigned-ipa
          path: Candela-unsigned.ipa
          if-no-files-found: error
